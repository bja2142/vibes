[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reversing-mcp"
version = "0.1.0"
description = "Static binary analysis MCP foundation with persisted sessions and structured results."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "angr==9.2.115",
  "cxxfilt>=0.3.0,<1",
  "flare-floss>=3.1.1,<4",
  "mcp>=1.10.0,<2",
  "macholib>=1.16.3,<2",
  "pefile>=2024.8.26,<2025",
  "pycparser==2.21",
  "pyelftools>=0.31,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9",
]

[project.scripts]
reversing-mcp = "reversing_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
